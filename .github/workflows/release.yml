# Release: tag + GitHub release on the release branch. Spec: specs/0005 (release flow).
#
# The version bump and the CHANGELOG roll happen BEFORE this, in a normal PR to
# `main` (`make release-notes VERSION=x.y.z`), so CI runs on them. A
# release-plz `release-pr` is not used: a PR opened with the default
# GITHUB_TOKEN never triggers CI, so its required checks would never report.
#
# On every push to `main`, release-plz (`git_only = true`, see release-plz.toml)
# compares the workspace version with the git tags. When `v<version>` does not
# exist yet, it creates the tag and the GitHub release. Otherwise it does nothing.
# `cargo deny check advisories` runs first and blocks the release on a new advisory.
name: release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: release
    runs-on: {group: ent-default, labels: [ci-rust]}
    timeout-minutes: 20
    permissions:
      contents: write
      # release-plz lists the pull requests of the released commit. Without
      # this scope the call returns 403 "Resource not accessible by integration".
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # git_only mode reads tags
      # The ci-rust image has no gh. release-plz/action always runs a git-config
      # step that calls `gh api`, so without gh the job stops with exit 127.
      # Pinned by version and sha256 (spec 0004, CI tools). Remove this step
      # when the ci-rust image ships gh.
      - name: Install gh (pinned)
        env:
          GH_VERSION: "2.101.0"
          GH_SHA256_X64: 9bca2d1c16825f109907a23307628a2f0698fbf99662b73a5cf0b020293072b8
          GH_SHA256_ARM64: b57e8063f18862647c9d22727c32e9da1b963f8bf9db648fe123a6975695640f
        run: |
          case "$RUNNER_ARCH" in
            X64) arch=amd64; sum="$GH_SHA256_X64" ;;
            ARM64) arch=arm64; sum="$GH_SHA256_ARM64" ;;
            *) echo "unsupported RUNNER_ARCH: $RUNNER_ARCH" >&2; exit 1 ;;
          esac
          name="gh_${GH_VERSION}_linux_${arch}"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/$name.tar.gz" \
            "https://github.com/cli/cli/releases/download/v${GH_VERSION}/$name.tar.gz"
          echo "$sum  $RUNNER_TEMP/$name.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$name.tar.gz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/$name/bin" >> "$GITHUB_PATH"
      # The same call the release-plz git-config step makes. It fails here, with
      # a clear name, if gh or the token does not work.
      - name: Check gh and the token
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          gh --version
          gh api graphql -f query='query { viewer { login } }' --jq .data.viewer.login
          # release-plz lists the pull requests of the released commit. This
          # needs the pull-requests scope.
          gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" --jq length
      # Blocks the release on an open advisory. No `if:`: a dispatch from a branch runs it too.
      - name: cargo deny check advisories
        run: cargo deny check advisories
      # Tag only from main. A manual run on another branch tests the steps above
      # and creates no tag.
      - uses: release-plz/action@8921286633dfa0c4020f7f30bd1c14fe19cbb10e # v0.5.142
        id: release-plz
        if: github.ref == 'refs/heads/main'
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ github.token }}
      # release-plz sets releases_created on every push to main in this workspace and
      # lists package tags that have no GitHub release. The SBOM attaches to the
      # uas-cli tag only, so the SBOM steps key on that tag.
      - name: Find the uas-cli release tag
        id: cli-tag
        if: github.ref == 'refs/heads/main'
        env:
          RELEASES: ${{ steps.release-plz.outputs.releases }}
        run: |
          set -euo pipefail
          tag="$(printf '%s' "${RELEASES:-[]}" | jq -r '.[] | select(.package_name=="uas-cli") | .tag')"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      # SBOM on the release. Only when release-plz released uas-cli on main.
      # Pinned by version and sha256 (spec 0004, CI tools; plan 0045 finding 2).
      - name: Install cargo-cyclonedx (pinned)
        if: github.ref == 'refs/heads/main' && steps.cli-tag.outputs.tag != ''
        env:
          CYCLONEDX_VERSION: 0.5.9
          CYCLONEDX_SHA256: fb8dbee9f182173e062a64a387b21a0badc6fab8b2abf9294973f012972bf6d8
        run: |
          set -euo pipefail
          name=cargo-cyclonedx-x86_64-unknown-linux-gnu
          curl -sSfL --retry 3 "https://github.com/CycloneDX/cyclonedx-rust-cargo/releases/download/cargo-cyclonedx-${CYCLONEDX_VERSION}/$name.tar.xz" -o "$RUNNER_TEMP/$name.tar.xz"
          echo "${CYCLONEDX_SHA256}  $RUNNER_TEMP/$name.tar.xz" | sha256sum -c -
          tar -xJf "$RUNNER_TEMP/$name.tar.xz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/$name" >> "$GITHUB_PATH"
      - name: make sbom
        if: github.ref == 'refs/heads/main' && steps.cli-tag.outputs.tag != ''
        run: |
          set -euo pipefail
          make sbom
          mkdir -p sbom
          find . -name '*.cdx.json' -not -path './target/*' -not -path './sbom/*' -exec cp {} sbom/ \;
          ls -l sbom
          test -n "$(ls -A sbom)"
      - name: Attach the SBOM to the release
        if: github.ref == 'refs/heads/main' && steps.cli-tag.outputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.cli-tag.outputs.tag }}
        run: |
          set -euo pipefail
          gh release upload "$TAG" sbom/*.cdx.json --clobber
