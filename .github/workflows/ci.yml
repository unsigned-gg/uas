# CI gates. Spec: specs/0005-ci-cache-and-runners.md; gate rules: specs/0002.
# Required checks on `main` (specs/0003): secrets, rust / cargo, cargo-deny, hygiene, ebpf-live, fork-gate.
# `fork-gate` (spec 0051 D8) decides fork PRs; every self-hosted job skips them.
# Every action is pinned by commit SHA with its version in a comment.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CARGO_NET_RETRY: "10"

jobs:
  secrets:
    name: secrets
    # Fork guard: self-hosted runners never run code from a fork.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: {group: ent-default, labels: [self-hosted]}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # gitleaks scans every reachable commit
      - name: gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          set -euo pipefail
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" -o gitleaks.tar.gz
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks git . --redact --no-banner --verbose

  rust:
    name: rust
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    uses: ./.github/workflows/_rust.yml
    with:
      jobs: 10
      nextest-profile: ci
    secrets: inherit

  cargo-deny:
    name: cargo-deny
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: {group: ent-default, labels: [ci-rust]}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # cargo-deny 0.19.9 is baked into the ci-rust image.
      - name: make deny
        run: |
          cargo deny --version
          make deny

  hygiene:
    name: hygiene
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: {group: ent-default, labels: [ci-rust]}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: hygiene
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # typos 1.49 is baked into the ci-rust image; machete is not.
      - uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2.87.26
        with:
          tool: cargo-machete
      - name: make hygiene (typos, machete, spec-check, toolchain-check)
        run: make hygiene JOBS=10

  moon-affected:
    name: moon-affected
    # Informational, not required: moon's affected graph runs only the tasks a
    # diff touches. The `rust` job is the gate. Pattern: unsigned-gg/soma-os ci.yml (EST-219).
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: {group: ent-default, labels: [ci-rust]}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # moon affected needs history; a shallow clone silently empties the diff
      # moon only. `auto-install: true` would run `proto install`, which detects
      # rust-toolchain.toml and drives rustup against the image's READ-ONLY
      # /usr/local/rustup (measured 2026-10-08: "could not remove 'install'
      # directory ... Permission denied", then every moon task re-downloads
      # rustfmt and clippy and fails). Rust stays the baked toolchain.
      - uses: moonrepo/setup-toolchain@261c62cb5b0f580c7be7c8cd0f023a2e96756095 # v0.6.4
        with:
          auto-install: false
          moon-version: 2.2.6
          cache-version: moon-only-v1
      # The moon `test` task runs nextest, which the ci-rust image does not bake.
      - uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2.87.26
        with:
          tool: cargo-nextest
      - name: moon ci (affected only)
        run: |
          set -euo pipefail
          # cargo must be the baked toolchain, not a proto shim.
          command -v cargo
          case "$(command -v cargo)" in "$HOME"/.proto/*) echo "::error::cargo resolves to a proto shim"; exit 1 ;; esac
          base="origin/${{ github.base_ref || 'main' }}"
          # moon 2.2.6 `moon ci` aborts with app::tty::required_id on an empty
          # task graph (docs-only diffs), so count affected tasks first.
          task_count=$(MOON_BASE="$base" moon query tasks --affected | jq '.tasks | length')
          if [ "$task_count" -eq 0 ]; then
            echo "::notice::no affected moon tasks for this diff; skipping"
            echo "moon-affected: SKIPPED (0 affected tasks)" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # --downstream deep: dependents of a changed crate run too (EST-219).
          moon ci --base "$base" --downstream deep

  text-check:
    name: text-check
    # Informational, not required: spec 0053 D10 adds it to the required checks after seven days
    # with no false failure. Add it to the required list in the header only then.
    # Fork guard: self-hosted runners never run code from a fork. Pull requests only, because a
    # push has no base to diff against (D5).
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: {group: ent-default, labels: [ci-rust]}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0 # the merge base with origin/<base> needs the history of both sides
      # The PR body and head ref reach the shell only as environment variables (REQ-0053-14).
      - name: make text-check
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          printf '%s' "$PR_BODY" > "$RUNNER_TEMP/pr-body.md"
          BASE="origin/$BASE_REF" PR_BODY_FILE="$RUNNER_TEMP/pr-body.md" make text-check

  ebpf-live:
    name: ebpf-live
    # Fork guard: this runner loads BPF into the node kernel. Never run a fork's code here.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    # ci-kernel lane (spec 0005): uid 0 in the pod, bounding set {BPF, PERFMON}, tracefs read-only.
    runs-on: {group: ent-default, labels: [ci-kernel]}
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: kernel facts
        run: |
          set -euo pipefail
          uname -r
          grep Cap /proc/self/status
          ls -l /sys/kernel/btf/vmlinux
          for e in sched_process_exec sched_process_fork sched_process_exit; do echo "== $e"; cat /sys/kernel/tracing/events/sched/$e/format; done

      # bpf-linker 0.11.1 is a static release binary, so no LLVM build runs here.
      - uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2.87.26
        with:
          tool: bpf-linker@0.11.1
      - name: bpf-linker
        run: bpf-linker --version

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: ebpf-live
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # The ci-kernel image has stable Rust only. The dated nightly goes into a job-local RUSTUP_HOME,
      # never into the baked /usr/local/rustup.
      - name: install pinned nightly (job-local RUSTUP_HOME)
        env:
          RUSTUP_HOME: ${{ runner.temp }}/rustup
        run: |
          set -euo pipefail
          rustup toolchain install nightly-2026-10-06 --profile minimal --component rust-src

      - name: "drift: rebuild uas-ebpf.o and compare with the committed object"
        env:
          RUSTUP_HOME: ${{ runner.temp }}/rustup
        run: |
          set -euo pipefail
          make ebpf-build JOBS=10 EBPF_TOOLCHAIN=nightly-2026-10-06
          git diff --exit-code -- crates/uas-ebpf/ebpf/

      - name: live probes (uid 0, no sudo)
        run: |
          set -euo pipefail
          make ebpf-test SUDO= JOBS=10 2>&1 | tee ebpf-live.log
          {
            echo "### ebpf-live"
            echo "- kernel: $(uname -r)"
            echo "- skipped lines: $(grep -c 'skipped:' ebpf-live.log || true)"
            echo "- result: $(grep -o 'test result: .*' ebpf-live.log | tail -n1 || true)"
          } >> "$GITHUB_STEP_SUMMARY"
          # A live case that cannot load prints "skipped:" and passes, so the job checks the log itself.
          unexpected=$(grep 'skipped:' ebpf-live.log | grep -v -F 'skipped: unshare -Upf --fork is refused here' || true)
          if [ -n "$unexpected" ]; then
            echo "::error::a live case was skipped, not run:"
            echo "$unexpected"
            exit 1
          fi
          grep -q 'test result: ok. 9 passed' ebpf-live.log || { echo "::error::expected 9 passed"; exit 1; }

  fork-gate:
    name: fork-gate
    # Spec 0051 D8. Always runs. A fork PR passes only with the label `fork-ci-approved` and a
    # maintainer comment `fork-ci-approved: <current head sha>`. Uses no action, checks out nothing,
    # and holds no secret: a fork's token is read-only. Labels, head SHA and comments are read from
    # the API at run time because a re-run replays the original event payload.
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: fork PR needs the label and a maintainer comment on the head SHA
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          BASE_REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          if [ "$EVENT" != "pull_request" ] || [ "$HEAD_REPO" = "$BASE_REPO" ]; then
            echo "not a fork PR; nothing to gate"
            exit 0
          fi
          labels_json=$(gh api "repos/$BASE_REPO/issues/$PR/labels?per_page=100")
          pull_json=$(gh api "repos/$BASE_REPO/pulls/$PR")
          comments_json=$(gh api --paginate "repos/$BASE_REPO/issues/$PR/comments?per_page=100")
          labels=$(printf '%s' "$labels_json" | jq -r '.[].name')
          head_sha=$(printf '%s' "$pull_json" | jq -r '.head.sha')
          want="fork-ci-approved: $head_sha"
          approved=$(printf '%s' "$comments_json" | jq -r --arg want "$want" \
            '.[] | select(.author_association == "OWNER" or .author_association == "MEMBER")
                 | select((.body | gsub("^\\s+|\\s+$"; "")) == $want) | .id')
          have_label=0
          if printf '%s\n' "$labels" | grep -xF 'fork-ci-approved' >/dev/null; then have_label=1; fi
          if [ "$have_label" = 1 ] && [ -n "$approved" ]; then
            echo "fork PR approved for head $head_sha"
            exit 0
          fi
          echo "::error::fork PR: a maintainer must add the label fork-ci-approved and comment exactly '$want', then re-run this job"
          exit 1
