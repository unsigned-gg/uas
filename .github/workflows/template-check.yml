# Template self-test. Deleted by `make new-repo` in every repo made from this template.
# Proves the template builds and passes its gates as-is, and that the rename
# (`make new-repo NAME=aaa-probe` in a temp copy) yields a workspace that is
# rustfmt-clean and builds with no `skel` left behind. Spec: specs/0001-template-architecture.md.
name: template-check

on:
  pull_request:
  push:
    branches: [development, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: template-check-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  template-check:
    name: template-check
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: {group: ent-default, labels: [ci-rust]}
    timeout-minutes: 45
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: template-check
          save-if: ${{ github.ref == 'refs/heads/development' || github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2.87.26
        with:
          tool: cargo-nextest
      # The rename probe commits inside a throwaway temp repo with its own
      # isolated git identity (see the Makefile); nothing is pushed.
      - name: make template-check
        run: make template-check JOBS=10
