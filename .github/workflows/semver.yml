# Semver gate (spec 0048 D13, REQ-0048-16). Not a required check until a crate publishes.
# While every crate sets `publish = false` the job prints a skip line and passes.
# Tool pin: specs/0004-dependency-and-licence-policy.md, CI tools table.
name: semver

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: semver-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  semver-checks:
    name: semver-checks
    # Fork guard: self-hosted runners never run code from a fork.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: {group: ent-default, labels: [ci-rust]}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: cargo-semver-checks
        env:
          SEMVER_CHECKS_VERSION: 0.51.0
          SEMVER_CHECKS_SHA256: cacadafaa5cd27ae6d05a74a103266917ebab4c5e43c898360e177d4fbf06a65
        run: |
          set -euo pipefail
          # `publish = false` shows as an empty list in cargo metadata; anything else may publish.
          published="$(cargo metadata --no-deps --format-version 1 --locked \
            | jq -r '.packages[] | select(.publish == null or (.publish | length) > 0) | .name')"
          if [ -z "$published" ]; then
            echo "skipped: no published crate"
            echo "semver-checks: skipped: no published crate" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          curl -sSfL "https://github.com/obi1kenobi/cargo-semver-checks/releases/download/v${SEMVER_CHECKS_VERSION}/cargo-semver-checks-x86_64-unknown-linux-gnu.tar.gz" -o semver-checks.tar.gz
          echo "${SEMVER_CHECKS_SHA256}  semver-checks.tar.gz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/semver-checks"
          tar -xzf semver-checks.tar.gz -C "$RUNNER_TEMP/semver-checks" cargo-semver-checks
          for crate in $published; do
            echo "::group::semver-checks $crate"
            "$RUNNER_TEMP/semver-checks/cargo-semver-checks" semver-checks --package "$crate"
            echo "::endgroup::"
          done
