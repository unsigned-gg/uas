# Path labels for PRs, from .github/labeler.yml. Write access is scoped to this job only.
name: labeler

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  label:
    name: labeler
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: {group: ent-default, labels: [self-hosted]}
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/labeler@bf12e9b00b37c5c0ca2b87b79b2daf7891dbda13 # v7.0.0
        with:
          sync-labels: true
