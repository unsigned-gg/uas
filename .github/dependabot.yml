version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      cargo-minor-patch:
        update-types:
          - minor
          - patch
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions-minor-patch:
        update-types:
          - minor
          - patch
  - package-ecosystem: cargo
    directory: /crates/uas-ebpf/ebpf
    schedule:
      interval: weekly
    groups:
      ebpf-minor-patch:
        update-types:
          - minor
          - patch
