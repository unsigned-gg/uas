// cortex.mesh.v1 — pool work distribution (CER-2362): a pool is a set of
// agent-kind members competing as consumers on one queue; each delivery
// runs on exactly one member. Lanes stay on Redis Streams; pools ride
// JetStream (approved design, operator decisions 2026-10-05).
//
// The pool a caller works on comes from its registered membership
// (mesh_peers.pool), NEVER from the request: a member cannot work a pool
// it is not in, and no field below carries a pool name for that reason.
syntax = "proto3";

package cortex.mesh.v1;

import "cortex/mesh/v1/lane.proto";
import "google/protobuf/empty.proto";

// A unit of pool work handed to a member.
message PoolDelivery {
  // Opaque acknowledgement handle: the JetStream ack subject, HMAC-bound to
  // the member it was delivered to. Any replica can ack with it; another
  // member cannot forge one.
  string delivery_token = 1;
  // The JetStream stream sequence — the status/dedupe key (with the pool
  // name), stable across route remaps.
  uint64 stream_seq = 2;
  LaneMessage message = 3;
  // The delivery lease in effect; members time Extend from lease_ms/3.
  uint32 lease_ms = 4;
  // 1 on first delivery, incrementing on redelivery; at max_deliver the
  // backend dead-letters instead.
  uint32 delivery_attempt = 5;
}

message PoolRecvRequest {
  // The caller's own peer id — pairs with the bearer token.
  string peer_id = 1;
  // Free slots the worker declares. The server delivers at most this many,
  // so a busy worker never prefetches work it cannot start.
  uint32 free_slots = 2;
}

message PoolAckRequest {
  string peer_id = 1;
  // Ack follows job completion: delivery is at-least-once.
  repeated string delivery_tokens = 2;
}

message PoolExtendRequest {
  string peer_id = 1;
  // Heartbeat an in-flight delivery (JetStream AckProgress). Members send
  // it every lease/3.
  string delivery_token = 2;
}

message PoolNackRequest {
  string peer_id = 1;
  string delivery_token = 2;
  // Redelivery delay.
  uint32 delay_ms = 3;
}

message PoolTermRequest {
  string peer_id = 1;
  string delivery_token = 2;
  // Poison reason, recorded on the dead-letter advisory.
  string reason = 3;
}

service PoolWork {
  // Server-streams deliveries, at most the declared free slots.
  rpc Recv(PoolRecvRequest) returns (stream PoolDelivery);
  rpc Ack(PoolAckRequest) returns (google.protobuf.Empty);
  rpc Extend(PoolExtendRequest) returns (google.protobuf.Empty);
  rpc Nack(PoolNackRequest) returns (google.protobuf.Empty);
  // Poison: dead-letter the delivery immediately.
  rpc Term(PoolTermRequest) returns (google.protobuf.Empty);
}
