// cortex.mesh.v1 — EdgeBridge: the workstation edge ↔ the cluster bridge brain
// (P4, CER-2222; design docs/spec/mesh-edge-bridge.md; operator ruling
// 2026-09-27).
//
// Split of responsibilities, and the reason this file exists:
// - The EDGE (`cortex-edge`, one per workstation) is the only thing that can
//   see herdr panes and type into them. It reports pane state and executes
//   deliveries. It holds ONE host credential (`service-edge-<host>`, minted
//   through the join broker) and no per-pane tokens.
// - The BRAIN (cortex-api) owns everything else: one peer per (host, pane),
//   heartbeats derived from reported state, role and subject derivation, the
//   sweep, and routing lane messages to the right host's delivery stream.
//
// HARD RULE (CER-2242): the brain never decides that a pane may take input.
// The edge MUST check the pane's live state immediately before injecting
// (herdr's atomic --only-if once CER-2246 lands), and only an INJECTED
// outcome may make the brain ack the underlying mailbox entry. A DEFERRED or
// FAILED delivery stays pending and is offered again later.
//
// Auth travels as gRPC metadata: `authorization: Bearer <edge credential>`.
// A peer id is never taken from the caller: the brain maps (edge host,
// pane_ref) to the peer it bound, so a local tool cannot speak as another
// pane (CER-2247).
syntax = "proto3";

package cortex.mesh.v1;

import "cortex/mesh/v1/lane.proto";
import "cortex/mesh/v1/registry.proto";
import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";

// herdr's observed state of an agent pane, as the edge sees it.
enum PaneState {
  PANE_STATE_UNSPECIFIED = 0;
  // At an empty prompt; a typed message is safe.
  PANE_STATE_IDLE = 1;
  // Mid-task; a typed message queues. Checked again at inject time, because
  // a working agent is the one that raises a dialog next.
  PANE_STATE_WORKING = 2;
  // A modal form or permission prompt is up. Enter here CONFIRMS: never
  // inject.
  PANE_STATE_BLOCKED = 3;
  // Task complete; the prompt box is free again.
  PANE_STATE_DONE = 4;
  // herdr cannot tell. Treated exactly like BLOCKED: never inject blind.
  PANE_STATE_UNKNOWN = 5;
}

// One agent pane on the edge's host.
message Pane {
  // Host-local herdr reference, e.g. `estate/w4:p4`. Unique per host.
  string pane_ref = 1;
  // `claude`, `omp`, `codex`, … as herdr reports it.
  string agent_kind = 2;
  PaneState state = 3;
  string cwd = 4;
  // Origin slug of the cwd's git remote (`cerebral-work/cortex`), derived
  // edge-side; empty when there is none.
  string project = 5;
  // The harness session id when herdr knows it.
  string agent_session = 6;
  google.protobuf.Timestamp observed_at = 7;
  // The pane's declared subject (`cortex-msg subject set`, read edge-side
  // from ~/.cortex/pane-subjects.json); empty = undeclared. The brain
  // registers it and re-mints the peer when it changes, as the Python
  // bridge did (E5). An edge that cannot read the file reports the last
  // value it read: an uncertain read never clears a declaration.
  string subject = 8;
}

// First message on a Connect stream.
message EdgeHello {
  // The workstation's short hostname, e.g. `ceres`.
  string host = 1;
  // The edge's build (its `--version`), for skew visibility.
  string edge_version = 2;
  // The protocol the edge speaks: `v1`.
  string protocol = 3;
  // The human operating the host, e.g. `chris@todie.io` — stamped on every
  // peer the brain binds for this edge. ADVISORY, exactly as on the JSON
  // register path: claimed by the edge, not yet a verified claim. (E1
  // contract gap, 2026-09-27: the brain stamps user on every peer, so the
  // hello must carry it.)
  string user = 4;
  // E1c shadow mode: the edge reports and computes but the brain registers,
  // beats and drains NOTHING — the dual-run migration step (spec
  // docs/spec/mesh-edge-bridge.md §Migration). The brain echoes the mode
  // back in the welcome so a misconfigured edge can see what it asked for.
  bool shadow = 5;
}

// The host's COMPLETE pane set at one moment. The brain reconciles against it:
// a pane absent from a snapshot is gone, and its peer stops being heartbeated.
// A full set instead of diffs keeps a reconnecting edge trivially correct.
message PaneSnapshot {
  repeated Pane panes = 1;
  // Monotonic per edge process, so the brain can drop a stale reordering.
  uint64 seq = 2;
  // herdr sessions whose agent list FAILED this pass. The complete-set
  // contract exempts them: the brain must not deregister (in shadow,
  // would-deregister) a pane whose session is listed here — a failed session
  // never authorizes pruning (CER-2261; the bridge's discipline).
  repeated string failed_sessions = 3;
}

enum DeliveryResult {
  DELIVERY_RESULT_UNSPECIFIED = 0;
  // Typed into the pane after a passing inject-time state check. The ONLY
  // result that lets the brain ack the mailbox entry.
  DELIVERY_RESULT_INJECTED = 1;
  // The inject-time check refused (the pane was blocked, unknown, or
  // unreadable). Not an error; the entry stays pending.
  DELIVERY_RESULT_DEFERRED = 2;
  // The check passed but typing failed (herdr error or timeout). The entry
  // stays pending.
  DELIVERY_RESULT_FAILED = 3;
}

message DeliveryOutcome {
  string delivery_id = 1;
  DeliveryResult result = 2;
  // The state the edge saw at inject time; explains a DEFERRED.
  PaneState observed_state = 3;
  // Human-readable detail for logs; never parsed.
  string detail = 4;
}

// A fresh JWT-SVID before the current one expires (D4, in-stream
// re-authentication). The brain verifies it with the same rules as the
// connect credential, requires the SAME host, and extends the stream's
// deadline to the new exp. A stream past deadline + 30s grace closes with
// Unauthenticated. Token-authed streams (the dual-accept fallback) are
// exempt: a reauth on one is logged and ignored.
message Reauth {
  string jwt_svid = 1;
}

// Edge → brain.
message EdgeUp {
  oneof msg {
    EdgeHello hello = 1;
    PaneSnapshot snapshot = 2;
    DeliveryOutcome outcome = 3;
    Reauth reauth = 4;
    EdgeRequest request = 5;
  }
}

// E5: a local tool's request (cortex-msg over ~/.cortex/edge.sock), relayed
// by the edge ON its Connect stream and answered by one EdgeResponse.
//
// Why on the stream and not a unary RPC: the brain's bindings live in the
// memory of the replica that holds the stream. A fresh dial goes through an
// L4 load balancer and can land on another replica, which has no binding
// (measured 2026-10-01: 2 cortex-api replicas, tailnet LB, no affinity). The
// stream is the one channel guaranteed to reach the right replica.
//
// The caller's identity is `pane_ref`, which the EDGE attributed from the
// kernel process tree. The brain acts as the peer it bound to that pane,
// using credentials that never leave the cluster. No op carries a peer id
// or token, so a local tool cannot act as another pane (CER-2247).
message EdgeRequest {
  // Edge-chosen and unique per stream; echoed in the response.
  string request_id = 1;
  string pane_ref = 2;
  oneof op {
    EdgeSendOp send = 3;
    EdgePeersOp peers = 4;
    EdgeReadOp read = 5;
    EdgeRecvOp recv = 6;
    EdgeAckOp ack = 7;
    EdgeStatusOp status = 8;
  }
}

// Send as the bound peer. The EdgeSendRequest rules apply: every sender
// field in `message` is overwritten by the brain.
message EdgeSendOp {
  SendTarget to = 1;
  LaneMessage message = 2;
}

// The live roster (the sweeper's predicate), as `MeshRegistry.ListPeers`.
message EdgePeersOp {}

// One message from the bound peer's own mailbox, by message id.
message EdgeReadOp {
  string message_id = 1;
}

// New entries plus pending ones idle at least `min_idle_ms`, from the bound
// peer's own mailbox. `count` 0 = the server default (10); clamped to 100.
// Unset `min_idle_ms` = the server default (30s); 0 replays everything
// pending, which is what an interactive inbox read wants.
message EdgeRecvOp {
  uint32 count = 1;
  optional uint64 min_idle_ms = 2;
}

// Ack entries in the bound peer's own mailbox.
message EdgeAckOp {
  repeated string stream_ids = 1;
}

// Sender-side disposition of a message the bound peer sent to `to_peer`
// (CER-2215). Not-found and not-yours are the same NOT_FOUND.
message EdgeStatusOp {
  string to_peer = 1;
  string message_id = 2;
}

// A recv result.
message LaneEntries {
  repeated LaneEntry entries = 1;
}

// The JSON route's MessageStatusView: `status` is unread | pending | acked.
message MessageDisposition {
  string status = 1;
  string stream_id = 2;
  optional uint64 idle_ms = 3;
  optional uint64 deliveries = 4;
}

// The answer to one EdgeRequest. `code` uses the google.rpc.Code numbering
// (0 = OK). A non-zero code carries `error` and no result.
message EdgeResponse {
  string request_id = 1;
  int32 code = 2;
  string error = 3;
  oneof result {
    SendResponse send = 4;
    ListPeersResponse peers = 5;
    LaneEntry entry = 6;
    LaneEntries entries = 7;
    google.protobuf.Empty acked = 8;
    MessageDisposition status = 9;
  }
}

// Sent on connect and again whenever a binding changes: which mesh peer the
// brain holds for a pane. Informational for the edge (logs, `status`); the
// edge never presents a peer id back as proof of anything.
message PeerBinding {
  string pane_ref = 1;
  string peer_id = 2;
  string role = 3;
  string subject = 4;
}

message EdgeWelcome {
  // The brain's id for this host.
  string host_id = 1;
  // How often the brain wants a snapshot even without a state change. A
  // silent edge is treated as gone after the same missed-beat rule the
  // sweeper applies to peers.
  int32 snapshot_secs = 2;
  // Echoes the hello's shadow flag (E1c): the edge can verify the mode it
  // is running in from the frame, not its own config.
  bool shadow = 3;
}

// One lane message for one pane on this host.
//
// Delivery is AT LEAST ONCE — across a stream drop a pending entry is
// offered again (the mailbox never auto-acks), and the same delivery_id may
// arrive twice. The edge SHOULD suppress an already-injected delivery_id
// (its choice of how — a seen-set is enough); the brain only ever learns
// the outcome, so it cannot dedupe on the edge's behalf.
message Delivery {
  // Opaque to the edge; echoed back in DeliveryOutcome.
  string delivery_id = 1;
  string pane_ref = 2;
  LaneEntry entry = 3;
}

// Brain → edge.
message EdgeDown {
  oneof msg {
    EdgeWelcome welcome = 1;
    PeerBinding binding = 2;
    Delivery delivery = 3;
    EdgeResponse response = 4;
  }
}

// A local tool's send, relayed by the edge. `pane_ref` is the pane the EDGE
// determined the caller runs in (from herdr and the process tree, never from
// the caller's environment); the brain sends as the peer bound to it.
//
// SENDER FIELDS ARE NEVER TRUSTED: the brain OVERWRITES `message.from_peer`,
// `message.from_session` and `message.from` with the bound peer's identity
// before the message is stored or routed, exactly as the `LaneMailbox.Send`
// path already does for `from_peer`. Whatever a caller put there is discarded,
// not validated. A brain implementation that forwards a caller-supplied
// sender field violates this contract.
message EdgeSendRequest {
  string pane_ref = 1;
  SendTarget to = 2;
  LaneMessage message = 3;
}

service EdgeBridge {
  // One long-lived stream per host edge: hello, then snapshots and delivery
  // outcomes up; welcome, bindings and deliveries down. A dropped stream
  // leaves undelivered entries pending; on reconnect they are offered again.
  rpc Connect(stream EdgeUp) returns (stream EdgeDown);
  // A local send attributed to one of this edge's panes. SUPERSEDED by
  // EdgeRequest.send on the Connect stream (E5): with more than one brain
  // replica a unary call can reach a replica that holds no binding for the
  // pane and fail FAILED_PRECONDITION. Kept because v1 is additive-only.
  rpc Send(EdgeSendRequest) returns (SendResponse);
}
