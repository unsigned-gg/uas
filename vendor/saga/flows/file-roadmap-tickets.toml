[flow]
name = "file-roadmap-tickets"
description = "DAG workflow: file and track Linear roadmap tickets for Estate Orchestration and 5-Layer TUI Suite."

[params.project_id]
required = false
default = "57c78591-3e4f-4222-ab7b-f94ea61dd320"

[params.tui_epic]
required = false
default = "EST-535"

[params.orch_epic]
required = false
default = "EST-534"

[[step]]
id = "file-tui-stream"
title = "File Live Orlog Stream ticket (EST-538)"
kind = "impl"
agent = "auto"
prompt = """
File ticket for TUI Layer 1: Live Orlog multi-column stream in skald with transport auto-selection.
Attach to project {{params.project_id}} and parent {{params.tui_epic}}.
"""
verify_cmd = ["linearctl", "show", "EST-538"]

[[step]]
id = "file-tui-picker"
title = "File Interactive Launcher ticket (EST-539)"
kind = "impl"
agent = "auto"
deps = ["file-tui-stream"]
prompt = """
File ticket for TUI Layer 2: Interactive Flow and Matrix Launcher with fuzzy search and parameter forms (saga pick).
Attach to project {{params.project_id}} and parent {{params.tui_epic}}.
"""
verify_cmd = ["linearctl", "show", "EST-539"]

[[step]]
id = "file-tui-tree"
title = "File Speculative Rollout Tree ticket (EST-540)"
kind = "impl"
agent = "auto"
deps = ["file-tui-picker"]
prompt = """
File ticket for TUI Layer 2: Speculative rollout tree inspector with pruning reasons and remediation deltas.
Attach to project {{params.project_id}} and parent {{params.tui_epic}}.
"""
verify_cmd = ["linearctl", "show", "EST-540"]

[[step]]
id = "file-tui-conflicts"
title = "File Conflict Resolution Deck ticket (EST-541)"
kind = "impl"
agent = "auto"
deps = ["file-tui-tree"]
prompt = """
File ticket for TUI Layer 3: Catch-up merge flattening and interactive conflict resolution deck.
Attach to project {{params.project_id}} and parent {{params.tui_epic}}.
"""
verify_cmd = ["linearctl", "show", "EST-541"]

[[step]]
id = "file-tui-slicer"
title = "File Semantic Context Slicer ticket (EST-542)"
kind = "impl"
agent = "auto"
deps = ["file-tui-conflicts"]
prompt = """
File ticket for TUI Layer 3: Semantic context slicing and diagnostic distillation deck widget.
Attach to project {{params.project_id}} and parent {{params.tui_epic}}.
"""
verify_cmd = ["linearctl", "show", "EST-542"]

[[step]]
id = "file-tui-world-model"
title = "File World Model Calibration ticket (EST-543)"
kind = "impl"
agent = "auto"
deps = ["file-tui-slicer"]
prompt = """
File ticket for TUI Layer 4: Closed-loop world model calibration curves and live drift heatmap in world pane.
Attach to project {{params.project_id}} and parent {{params.tui_epic}}.
"""
verify_cmd = ["linearctl", "show", "EST-543"]

[[step]]
id = "file-tui-herdr"
title = "File Herdr 6-Pane Layout ticket (EST-544)"
kind = "impl"
agent = "auto"
deps = ["file-tui-world-model"]
prompt = """
File ticket for TUI Layer 4: Herdr 6-pane plugin package and layout orchestration.
Attach to project {{params.project_id}} and parent {{params.tui_epic}}.
"""
verify_cmd = ["linearctl", "show", "EST-544"]

[[step]]
id = "file-orch-patch"
title = "File Cargo Patch Injector ticket (EST-545)"
kind = "impl"
agent = "auto"
deps = ["file-tui-herdr"]
prompt = """
File ticket for Orchestration: Cross-repo relative Cargo [patch] injector with zero-residue rollback.
Attach to project {{params.project_id}} and parent {{params.orch_epic}}.
"""
verify_cmd = ["linearctl", "show", "EST-545"]

[[step]]
id = "file-orch-matrix-board"
title = "File Concurrency Matrix Board ticket (EST-546)"
kind = "impl"
agent = "auto"
deps = ["file-orch-patch"]
prompt = """
File ticket for Orchestration: Live concurrency matrix board with slot occupancy gauges and token burn rate.
Attach to project {{params.project_id}} and parent {{params.orch_epic}}.
"""
verify_cmd = ["linearctl", "show", "EST-546"]

[[step]]
id = "file-orch-retire"
title = "File Raid Root Retirement ticket (EST-547)"
kind = "impl"
agent = "auto"
deps = ["file-orch-matrix-board"]
prompt = """
File ticket for Orchestration: Fail-closed raid root landing verification and retirement engine (saga raid retire).
Attach to project {{params.project_id}} and parent {{params.orch_epic}}.
"""
verify_cmd = ["linearctl", "show", "EST-547"]

[[step]]
id = "operator-gate"
title = "Approve roadmap tickets"
kind = "gate"
gate = "heimdal:approval"
deps = ["file-orch-retire"]
prompt = "Operator review and sign-off on the expanded Linear roadmap tickets for Estate Orchestration and TUI Suite."
