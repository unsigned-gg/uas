[flow]
name = "ship-feature"
description = "Full feature lifecycle: track ticket, implement, test, lint, gate approval, document, and close ticket."

[params.feature_name]
required = true

[params.issue_id]
required = false
default = "TBD"

[[step]]
id = "track-ticket"
title = "Track Linear issue"
kind = "impl"
agent = "auto"
prompt = """
Ensure Linear issue {{params.issue_id}} is filed or tracked for {{params.feature_name}}.
"""

[[step]]
id = "implement"
title = "Implement feature"
kind = "impl"
agent = "auto"
deps = ["track-ticket"]
prompt = """
Implement {{params.feature_name}} corresponding to issue {{params.issue_id}}.
Follow the coding conventions of the repository. Ensure the code compiles
and existing tests are not broken.
"""

[[step]]
id = "test-check"
title = "Run test suite"
kind = "test"
agent = "claude"
deps = ["implement"]
verify_cmd = ["cargo", "test", "--locked"]
prompt = "Confirm all unit and integration tests pass for {{params.feature_name}}."

[[step]]
id = "clippy-check"
title = "Run clippy linter"
kind = "test"
agent = "claude"
deps = ["implement"]
verify_cmd = ["cargo", "clippy", "--all-targets", "--", "-D", "warnings"]
prompt = "Confirm the code passes clippy without warnings."

[[step]]
id = "operator-gate"
title = "Approve shipment"
kind = "gate"
gate = "heimdal:approval"
deps = ["test-check", "clippy-check"]
prompt = "Review test and clippy receipts, then sign off on {{params.feature_name}}."

[[step]]
id = "document"
title = "Update documentation"
kind = "docs"
agent = "claude"
deps = ["operator-gate"]
prompt = "Document {{params.feature_name}} in the project's docs and update the changelog if one exists."

[[step]]
id = "close-ticket"
title = "Close Linear issue"
kind = "impl"
agent = "auto"
deps = ["document"]
prompt = """
Close Linear issue {{params.issue_id}} upon successful shipment of {{params.feature_name}}.
"""
