[flow]
name = "saga-build"
description = "Parallel multi-agent critical path DAG dogfooding saga to build and verify saga with budget caps and concurrency limits."

[params.repo]
required = true
default = "unsigned-gg/saga"

[limits]
max_in_flight = 4

[limits.per_agent]
claude = 2
omp = 2
opencode = 2

[budget]
max_tokens = 500000
max_cost_usd = 10.0

[[step]]
id = "build-check"
title = "Cargo workspace compilation check"
kind = "impl"
agent = "claude"
prompt = "Run cargo check --workspace --all-targets across {{params.repo}}"
verify_cmd = ["cargo", "check", "--workspace", "--all-targets"]

[step.budget]
max_tokens = 100000
max_cost_usd = 2.00

[[step]]
id = "fmt-check"
title = "Rustfmt formatting verification"
kind = "test"
agent = "omp"
deps = ["build-check"]
prompt = "Verify rust formatting with cargo fmt --all --check"
verify_cmd = ["cargo", "fmt", "--all", "--check"]

[step.budget]
max_tokens = 50000
max_cost_usd = 1.00

[[step]]
id = "clippy-check"
title = "Clippy strict linting"
kind = "test"
agent = "opencode"
deps = ["build-check"]
prompt = "Run cargo clippy --all-targets -- -D warnings"
verify_cmd = ["cargo", "clippy", "--all-targets", "--", "-D", "warnings"]

[step.budget]
max_tokens = 100000
max_cost_usd = 2.00

[[step]]
id = "test-domain-flow"
title = "Domain and flow integration suites"
kind = "test"
agent = "claude"
deps = ["build-check"]
prompt = "Run unit tests for saga-domain, saga-flow, and volva crates"
verify_cmd = ["cargo", "test", "-p", "saga-domain", "-p", "saga-flow", "-p", "volva", "--locked"]

[step.budget]
max_tokens = 100000
max_cost_usd = 2.00

[[step]]
id = "test-bifrost-engine"
title = "Bifrost execution engine and harness tests"
kind = "test"
agent = "omp"
deps = ["build-check"]
prompt = "Run unit tests for bifrost and heimdal crates"
verify_cmd = ["cargo", "test", "-p", "bifrost", "-p", "heimdal", "--locked"]

[step.budget]
max_tokens = 100000
max_cost_usd = 2.00

[[step]]
id = "deny-check"
title = "Cargo-deny security and advisory check"
kind = "test"
agent = "opencode"
deps = ["build-check"]
prompt = "Run cargo deny check"
verify_cmd = ["cargo", "deny", "check"]

[step.budget]
max_tokens = 50000
max_cost_usd = 1.00

[[step]]
id = "merge-gate"
title = "Operator gate: review and sign off"
kind = "gate"
agent = "heimdal"
gate = "heimdal:approval"
deps = ["fmt-check", "clippy-check", "test-domain-flow", "test-bifrost-engine", "deny-check"]
prompt = "Human operator approval gate for {{params.repo}} dogfood run"
