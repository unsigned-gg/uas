# self-improve: saga lands one of its own roadmap items (spec 0027, stage 1).
#
# Step kinds that EXIST today: plan, impl, test, note, gate.
# Step kinds that are NEW and do NOT run yet: land.
# This flow cannot run end to end until the stage 1 code (the `land` kind
# and the `pick` source over .dagr/run.json) lands.
# A lane starts each run on Christian's word. No cron, no unattended loop.

[flow]
name = "self-improve"
description = "Pick the next queued DAG task, implement it, check it, land it through a pull request, and record the outcome."

[params.items]
required = false
default = "1"

[params.budget_usd]
required = false
default = "10"

# The DAG task this run is for. `saga pick` prints the command with it set. When set, the
# engine writes the run outcome into the project DAG at run end (`saga runs apply`).
[params.task]
required = false

[params.source]
required = false
default = "dag"

# Review gate. true for the first 5 iterations. Christian may set false by ruling.
[params.gated]
required = false
default = "true"

[limits]
max_in_flight = 2

[budget]
max_tokens = 4000000
max_cost_usd = 10.0

# EXISTS today (kind plan). The pick logic over .dagr/run.json is NEW (stage 1 code).
# Rule: state queued, owner saga or unowned, all deps done, lowest rank (array order).
[[step]]
id = "pick"
title = "Pick the next queued task from .dagr/run.json"
kind = "plan"
agent = "auto"
prompt = """Read the file .claude/skills/saga-pick/SKILL.md in the current directory and follow it exactly. 
Read .dagr/run.json. Choose the next task with state queued, owner saga or no owner,
all deps done, and the lowest rank (position in the tasks array).
When {{params.task}} is non-empty, choose exactly that task and do not apply the rule.
Print the chosen task id, title and detail. Source: {{params.source}}.
Fail if no task qualifies, or if the named task does not exist.
"""

# EXISTS today (kind impl).
[[step]]
id = "implement"
title = "Implement the chosen task"
kind = "impl"
cwd = "worktree"
agent = "auto"
deps = ["pick"]
rounds_max = 3
# The step must leave a committed change. Without this, a no-op agent run settled "done" and
# the checks below passed on an empty diff (live run 20261009-001506).
verify_cmd = ["sh", "-c", "! git diff --quiet origin/development HEAD"]
prompt = """Read the file .claude/skills/saga-implement/SKILL.md in the current directory and follow it exactly. 
Implement the task chosen by the pick step: use its title and detail from the DAG.
Work only in this worktree. Sign every commit. Add or update tests, and a CHANGELOG entry.
"""

# EXISTS today (kind test).
[[step]]
id = "test-check"
title = "Run test suite"
kind = "test"
cwd = "worktree"
agent = "claude"
deps = ["implement"]
verify_cmd = ["env", "-u", "SAGA_DEFAULT_MODEL", "cargo", "test", "--locked"]
prompt = "Confirm all tests pass."

[[step]]
id = "clippy-check"
title = "Run clippy linter"
kind = "test"
cwd = "worktree"
agent = "claude"
deps = ["implement"]
verify_cmd = ["cargo", "clippy", "--workspace", "--all-targets", "--", "-D", "warnings"]
prompt = "Confirm clippy reports no warnings."

[[step]]
id = "fmt-check"
title = "Check formatting"
kind = "test"
cwd = "worktree"
agent = "claude"
deps = ["implement"]
verify_cmd = ["cargo", "fmt", "--all", "--check"]
prompt = "Confirm formatting is clean."

# EXISTS today (kind gate). Human only. Active while params.gated is true
# (first 5 iterations). The gate condition is NEW stage 1 behaviour.
[[step]]
id = "review-gate"
title = "Human review before landing"
kind = "gate"
gate = "heimdal:approval"
deps = ["test-check", "clippy-check", "fmt-check"]
prompt = "Review the test, clippy and fmt receipts and the diff, then approve or reject landing."

# NEW kind, does NOT exist today (stage 1 code). Sequence:
#   1 check commits are signed  2 push branch  3 gh pr create --base development
#   4 poll check-runs  5 gh pr merge N --merge --match-head-commit <sha> on green
#   6 read the merge SHA back from GitHub. Receipt = that merge SHA.
[[step]]
id = "land"
title = "Open the PR against development and merge on green"
kind = "land"
cwd = "worktree"
agent = "auto"
deps = ["review-gate"]
prompt = """Read the file .claude/skills/saga-land/SKILL.md in the current directory and follow it exactly. 
Push the branch, open a pull request with base development, wait for all required
check-runs, merge with --match-head-commit on green, and read the merge SHA back.
Stop at the first red. Never merge to main.
"""

# EXISTS today (kind note). Writes the world model outcome (mock false). The engine, not this
# step, writes the DAG: at run end it appends an attempt to the task and sets the task state
# (`saga runs apply` replays it by hand).
[[step]]
id = "record"
title = "Record the outcome and close the DAG task"
kind = "note"
cwd = "worktree"
agent = "auto"
deps = ["land"]
prompt = """Read the file .claude/skills/saga-record/SKILL.md in the current directory and follow it exactly. 
Write the outcome to the world model with the merge SHA receipt.
Do not edit .dagr/run.json: the engine applies the outcome to the DAG when the run ends.
"""
