[package]
name = "cas-ebpf"
description = "Aya eBPF tracepoint programs: build-priority clamping and audit telemetry."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[[bin]]
name = "cas-ebpfd"
path = "src/bin/cas-ebpfd.rs"

[dependencies]
anyhow = { workspace = true }
aya = { workspace = true }
clap = { workspace = true }
rustix = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[build-dependencies]
# build.rs checks the committed BPF object against ebpf/cas-ebpf.o.sha256 (spec 0014 D3).
sha2 = { workspace = true }

[lints.rust]
# Spec 0001 decision 2026-10-09: this crate makes raw syscalls. unsafe is denied,
# not forbidden, so one block may opt in with #[allow(unsafe_code)] and a
# `// SAFETY:` comment. Keep the other entries in step with [workspace.lints].
unsafe_code = "deny"
missing_docs = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
undocumented_unsafe_blocks = "deny"
