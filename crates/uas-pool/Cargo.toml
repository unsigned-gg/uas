[package]
name = "uas-pool"
description = "Worker slot manager: warm worktree pool (gitoxide), cgroup v2 suspend and resume."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
uas-domain = { path = "../uas-domain" }
uas-ebpf = { path = "../uas-ebpf" }
gix = { workspace = true }
rustix = { workspace = true }
serde = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
tokio = { workspace = true }
criterion = { version = "0.8.2", default-features = false, features = ["cargo_bench_support"] }

[[bench]]
name = "slot_lifecycle"
harness = false

[lints.rust]
# Spec 0001 decision 2026-10-09: this crate makes raw syscalls. unsafe is denied,
# not forbidden, so one block may opt in with #[allow(unsafe_code)] and a
# `// SAFETY:` comment. Keep the other entries in step with [workspace.lints].
unsafe_code = "deny"
missing_docs = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
undocumented_unsafe_blocks = "deny"

