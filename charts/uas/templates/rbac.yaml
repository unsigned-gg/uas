apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "uas.fullname" . }}-operator
  namespace: {{ .Values.namespace.name }}
  labels:
    {{- include "uas.labels" . | nindent 4 }}
    app.kubernetes.io/component: operator
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "uas.fullname" . }}-daemon
  namespace: {{ .Values.namespace.name }}
  labels:
    {{- include "uas.labels" . | nindent 4 }}
    app.kubernetes.io/component: daemon
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "uas.fullname" . }}-operator
  labels:
    {{- include "uas.labels" . | nindent 4 }}
    app.kubernetes.io/component: operator
rules:
  # run_k8s_watch_loop (crates/uas-operator/src/lib.rs) watches WorkerSlot and patches its status.
  - apiGroups: ["uas.unsigned.gg"]
    resources: ["workerslots"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["uas.unsigned.gg"]
    resources: ["workerslots/status"]
    verbs: ["patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "uas.fullname" . }}-operator
  labels:
    {{- include "uas.labels" . | nindent 4 }}
    app.kubernetes.io/component: operator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "uas.fullname" . }}-operator
subjects:
  - kind: ServiceAccount
    name: {{ include "uas.fullname" . }}-operator
    namespace: {{ .Values.namespace.name }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "uas.fullname" . }}-daemon
  labels:
    {{- include "uas.labels" . | nindent 4 }}
    app.kubernetes.io/component: daemon
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "uas.fullname" . }}-operator
subjects:
  - kind: ServiceAccount
    name: {{ include "uas.fullname" . }}-daemon
    namespace: {{ .Values.namespace.name }}
