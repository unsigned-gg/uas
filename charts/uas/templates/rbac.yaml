apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "uas.fullname" . }}-operator
  namespace: {{ .Values.namespace.name }}
  labels:
    {{- include "uas.labels" . | nindent 4 }}
    app.kubernetes.io/component: operator
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "uas.fullname" . }}-daemon
  namespace: {{ .Values.namespace.name }}
  labels:
    {{- include "uas.labels" . | nindent 4 }}
    app.kubernetes.io/component: daemon
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "uas.fullname" . }}-operator
  labels:
    {{- include "uas.labels" . | nindent 4 }}
    app.kubernetes.io/component: operator
rules:
  - apiGroups: ["uas.cerebral.work"]
    resources:
      - sandboxes
      - sandboxes/status
      - snapshotlineages
      - snapshotlineages/status
      - egressprofiles
      - egressprofiles/status
      - secretgrants
      - secretgrants/status
    verbs: ["get", "list", "watch", "create", "update", "patch"]
  - apiGroups: [""]
    resources: ["pods", "services", "configmaps", "events"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["networkpolicies"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["external-secrets.io"]
    resources: ["externalsecrets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "uas.fullname" . }}-operator
  labels:
    {{- include "uas.labels" . | nindent 4 }}
    app.kubernetes.io/component: operator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "uas.fullname" . }}-operator
subjects:
  - kind: ServiceAccount
    name: {{ include "uas.fullname" . }}-operator
    namespace: {{ .Values.namespace.name }}
