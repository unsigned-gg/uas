# Conventional Commits + gitleaks + affected-crate cargo checks.
# Skip all hooks with LEFTHOOK=0.
commit-msg:
  commands:
    conventional:
      # Spec 0051 owns the subject regex below; change it there first.
      # git's own merge and revert subjects are allowed: merge commits are the
      # branch model (specs/0003), and they must not need a hook bypass.
      run: |
        head -1 {1} | grep -qE '^((feat|fix|perf|refactor|docs|test|ci|build|infra|security|style|chore)(\(.+\))?!?: .+|Merge .+|Revert ".+")' \
          || { echo "commit-msg must be Conventional Commits: <type>(scope): <desc>"; exit 1; }

pre-commit:
  parallel: true
  commands:
    gitleaks:
      # `cmd || echo` would swallow a real finding (gitleaks exits non-zero on a
      # leak). A leak blocks the commit, and so does a MISSING binary (spec 0051
      # D7, fail closed). Bypass on purpose with LEFTHOOK=0.
      run: |
        if command -v gitleaks >/dev/null 2>&1; then
          gitleaks protect --staged --redact --no-banner
        else
          echo "gitleaks not installed: install v8.30.1 (the version CI pins) from https://github.com/gitleaks/gitleaks/releases/tag/v8.30.1" >&2
          exit 1
        fi
    affected-tests:
      run: ./scripts/lefthook-affected-cargo.sh --staged test

pre-push:
  commands:
    affected-clippy:
      run: ./scripts/lefthook-affected-cargo.sh --push clippy
    affected-tests:
      run: ./scripts/lefthook-affected-cargo.sh --push test
