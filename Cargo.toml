[workspace]
resolver = "2"
members = ["crates/*", "xtask"]

[workspace.package]
edition = "2021"
version = "0.1.0"
# Floor: the highest MSRV in Cargo.lock, uuid 1.28.0 via agent-client-protocol (spec 0004 D2).
# The pinned toolchain is in rust-toolchain.toml.
rust-version = "1.89"
publish = false
license = "Apache-2.0 OR MIT"
authors = ["unsigned.gg"]
repository = "https://github.com/unsigned-gg/uas"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[workspace.dependencies]
# Derive (de)serialization for domain types and CLI output.
serde = { version = "1", features = ["derive"] }
# JSON output for the CLI.
serde_json = "1"
# Typed error enums in library crates.
thiserror = "2"
# Context-carrying errors in binaries and xtask.
anyhow = "1"
# Argument parsing for the CLI.
clap = { version = "4", features = ["derive", "env"] }
# Structured logging facade.
tracing = "0.1"
# Log output and RUST_LOG filtering.
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
# TOML deserialization for Saga flows (.saga/flows/*.toml) and xtask (advisory-check).
toml = "1.1"
# Landlock LSM rulesets for the worker filesystem jail (spec 0010, CER-2715).
landlock = "0.4.7"
# Async runtime for the gateway proxy in uas-router (spec 0013, CER-2718). Approved features
# plus io-util, which AsyncReadExt and AsyncWriteExt need; recorded in spec 0004.
tokio = { version = "=1.53.1", default-features = false, features = ["rt-multi-thread", "macros", "net", "time", "sync", "io-util"] }
# unshare, procfs writes and the lo ioctl for the worker network namespace (spec 0011, CER-2717).
rustix = { version = "1.1.5", default-features = false, features = ["std", "thread", "process", "fs", "net"] }
# Userspace eBPF loader, tracepoint attach and ring buffer reader in uas-ebpf (spec 0014, CER-2719, CER-2720).
aya = "0.14.0"
# seccomp-BPF deny-list filter for the worker (spec 0043 D7, spec 0004). Default features; no libseccomp link.
seccompiler = "0.5.0"
# Syscall numbers for the seccomp filter: seccompiler keys rules by number and rustix exports none (plan 0043 R1, spec 0004).
libc = "0.2.190"
# SHA-256 for the run_hash transcript digest (spec 0014), the committed BPF object check in uas-ebpf build.rs, and the uas-router prefix hash and HRW weight (spec 0017).
sha2 = "0.11.0"
# Agent Client Protocol wire types for uas-acp (spec 0016, amendment A1). The crate pins schema 1.9.1; ACP is JSON-RPC 2.0 over stdio.
agent-client-protocol = "3.3.0"
# Axum web service for the operator deck (spec 0018, CER-2733). `serve` needs http1 and tokio;
# `ws` waits for the WebSocket slice (D2). Madstack pin, spec 0004.
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio"] }
# Cortex pool-member transport in uas-engine, feature cortex-grpc (spec 0026 D3, spec 0004): the
# versions cortex@c7fdb85 uses, each pinned with `=`.
# gRPC client for the PoolWork service; `server` is a dev-dependency feature for the fake server.
tonic = { version = "=0.14.6", default-features = false, features = ["channel", "codegen"] }
# prost codec glue for the generated tonic code.
tonic-prost = "=0.14.6"
# Protobuf runtime for the generated messages.
prost = "=0.14.4"
# Struct and Timestamp of lane.proto and peer.proto.
prost-types = "=0.14.4"
# Generates the tonic client and server stubs in build.rs.
tonic-prost-build = { version = "=0.14.6", default-features = false }
# Compiles the vendored protos in build.rs with no system protoc.
protox = "=0.9.1"
# Compile-time HTML templates for the deck (spec 0018 D1). The `axum` feature gives Markup a response type.
maud = { version = "0.27.0", features = ["axum"] }

# In-process git operations for warm worktrees in uas-pool (spec 0004, 0015, CER-2724).
gix = { version = "0.88.0", default-features = false, features = ["worktree-mutation", "revision", "sha1"] }
# Kubernetes client, controller runtime, and CustomResource derive in uas-operator, feature k8s (specs 0038, 0039 D1, spec 0004).
kube = { version = "=4.2.0", features = ["runtime", "derive"] }
# Kubernetes OpenAPI schema types in uas-operator, feature k8s (specs 0038, 0039 D1, spec 0004).
k8s-openapi = { version = "=0.28.0", features = ["v1_36"] }
# JSON Schema derive for CustomResource in uas-operator, feature k8s (specs 0038, 0039 D1, spec 0004).
schemars = { version = "=1.2.2", features = ["derive"] }
# Async stream combinators for the kube runtime controller stream in uas-operator, feature k8s (spec 0004).
futures-util = "=0.3.34"

# Example of a private git dependency (record it in specs/0004 before first use):
# pgt-core = { git = "https://github.com/cerebral-work/pgt", rev = "54d90f5" }

[profile.release]
lto = true
codegen-units = 1

[profile.dev]
debug = "line-tables-only"
