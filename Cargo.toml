[workspace]
resolver = "2"
members = ["crates/*", "xtask"]

[workspace.package]
edition = "2021"
version = "0.1.0"
# Floor: the highest MSRV in Cargo.lock, uuid 1.28.0 via agent-client-protocol (spec 0004 D2).
# The pinned toolchain is in rust-toolchain.toml.
rust-version = "1.89"
publish = false
license = "LicenseRef-Proprietary"
authors = ["Christian M. Todie <chris@todie.io>"]
repository = "https://github.com/cerebral-work/cas-substrate"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[workspace.dependencies]
# Derive (de)serialization for domain types and CLI output.
serde = { version = "1", features = ["derive"] }
# JSON output for the CLI.
serde_json = "1"
# Typed error enums in library crates.
thiserror = "2"
# Context-carrying errors in binaries and xtask.
anyhow = "1"
# Argument parsing for the CLI.
clap = { version = "4", features = ["derive"] }
# Structured logging facade.
tracing = "0.1"
# Log output and RUST_LOG filtering.
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# TOML deserialization for Saga flows (.saga/flows/*.toml).
toml = "0.8"
# Landlock LSM rulesets for the worker filesystem jail (spec 0010, CER-2715).
landlock = "0.4.7"
# Async runtime for the gateway proxy in cas-router (spec 0013, CER-2718). Approved features
# plus io-util, which AsyncReadExt and AsyncWriteExt need; recorded in spec 0004.
tokio = { version = "1.53.1", default-features = false, features = ["rt-multi-thread", "macros", "net", "time", "sync", "io-util"] }
# unshare, procfs writes and the lo ioctl for the worker network namespace (spec 0011, CER-2717).
rustix = { version = "1.1.5", default-features = false, features = ["std", "thread", "process", "fs"] }
# Userspace eBPF loader, tracepoint attach and ring buffer reader in cas-ebpf (spec 0014, CER-2719, CER-2720).
aya = "0.14.0"
# SHA-256 for the run_hash transcript digest (spec 0014), the committed BPF object check in cas-ebpf build.rs, and the cas-router prefix hash and HRW weight (spec 0017).
sha2 = "0.11.0"
# Agent Client Protocol wire types for cas-acp (spec 0016, amendment A1). The crate pins schema 1.9.1; ACP is JSON-RPC 2.0 over stdio.
agent-client-protocol = "2.2.0"

# In-process git operations for warm worktrees in cas-pool (spec 0004, 0015, CER-2724).
gix = { version = "0.88.0", default-features = false, features = ["worktree-mutation", "revision", "sha1"] }

# Example of a private git dependency (record it in specs/0004 before first use):
# pgt-core = { git = "https://github.com/cerebral-work/pgt", rev = "54d90f5" }

[profile.release]
lto = true
codegen-units = 1

[profile.dev]
debug = "line-tables-only"
